name: Check Repository

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== ROOT FILES ====="
          ls -la
          echo ""
          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort
