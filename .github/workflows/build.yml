name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project files
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          adb version

      - name: Find Gradle wrapper
        id: gradle
        run: |
          GRADLEW=$(find . -name gradlew -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew file was found."
            echo "The repository does not appear to contain a Gradle Android project."
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          echo "path=$GRADLEW" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.gradle.outputs.path }}"

      - name: Build APK
        run: |
          GRADLEW="${{ steps.gradle.outputs.path }}"
          PROJECT_DIR="$(dirname "$GRADLEW")"

          cd "$PROJECT_DIR"
          "$PWD/gradlew" assembleDebug

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
