name: Inspect Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q "StudySA-AI-Android-Play-Project.zip" -d android-project

      - name: Show everything in ZIP
        run: |
          echo "===== ZIP CONTENTS ====="
          find android-project -type f | sort
